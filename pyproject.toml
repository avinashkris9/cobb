[project]
name = "cobb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Avinash", email = "avinashkris9@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.12.15",
    "click>=8.2.1",
    "slack-bolt>=1.25.0",
]

classifiers = ["Private :: Do Not Upload"]
[project.scripts]
cobb = "cobb:main"
cobb-slack = "cobb.slack_bot:slack_starter"
[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13.0",
]
