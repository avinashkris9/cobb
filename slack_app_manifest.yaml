display_information:
  name: cobb
  description: Your DevOps Assistant
  background_color: "#111a36"
features:
  bot_user:
    display_name: cobb
    always_online: false
  slash_commands:
    - command: /info
      description: shows current status
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
